name: 'cloudmart_dbt'
version: '1.0.0'
config-version: 2

profile: 'cloudmart'

model-paths: ["models"]
test-paths:  ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  cloudmart_dbt:
    bronze:
      +materialized: table
      +schema: bronze
      +tags: ["bronze"]
    silver:
      +materialized: table
      +schema: silver
      +tags: ["silver"]
    gold:
      +materialized: table
      +schema: gold
      +tags: ["gold", "analytics"]
