name: CloudMart DataOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint Python (Glue Jobs)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 glue_jobs/ --max-line-length=120 --ignore=E501,W503,E302,E303

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Valida IaC (CDK Synth)
  # ──────────────────────────────────────────────────────────────────────────
  cdk-synth:
    name: CDK Synth (validate IaC)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CDK CLI
        run: npm install -g aws-cdk
      - name: Install CDK Python deps
        working-directory: infrastructure/cdk
        run: pip install -r requirements.txt
      - name: CDK Synth
        working-directory: infrastructure/cdk
        run: cdk synth --no-staging
        env:
          AWS_DEFAULT_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. dbt Docs — Gera e publica documentação viva
  #
  # Executa dbt docs generate com --empty-catalog para compilar toda a
  # documentação a partir dos arquivos YAML sem necessidade de conexão
  # ao Athena (adequado para CI). Em produção o pipeline CloudMart executa
  # dbt docs generate com conexão real para incluir estatísticas de catalog.
  #
  # Artefatos publicados em: s3://<DOCS_BUCKET>/dbt-docs/
  # Acesso: configure um site estático no bucket ou use CloudFront.
  # ──────────────────────────────────────────────────────────────────────────
  dbt-docs:
    name: dbt Docs Generate & Publish
    runs-on: ubuntu-latest
    needs: [lint, cdk-synth]
    # Gera docs apenas em push para main (não em PRs) para não publicar
    # documentação de branches inacabadas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt + Athena adapter
        run: pip install "dbt-athena-community>=1.8,<2.0"

      - name: Verify dbt installation
        run: dbt --version

      # --empty-catalog: gera docs sem consultar o Athena para obter tipos.
      # As descrições dos arquivos YAML são incluídas normalmente.
      # Remover esta flag em ambientes com acesso ao Athena para docs completos.
      - name: Generate dbt docs
        working-directory: dbt
        run: dbt docs generate --profiles-dir . --empty-catalog
        env:
          # Variáveis necessárias para o profiles.yml mesmo com --empty-catalog
          DBT_S3_STAGING_DIR: "s3://placeholder-not-used-empty-catalog/"
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'sa-east-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Salva os artefatos de documentação como artifact do workflow
      # para download/visualização sem necessidade de S3.
      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-${{ github.sha }}
          path: |
            dbt/target/manifest.json
            dbt/target/catalog.json
            dbt/target/index.html
          retention-days: 30

      # Publica no S3 apenas se a secret DOCS_BUCKET estiver configurada.
      - name: Publish docs to S3
        if: ${{ secrets.DOCS_BUCKET != '' }}
        run: |
          aws s3 sync dbt/target/ \
            s3://${{ secrets.DOCS_BUCKET }}/dbt-docs/ \
            --exclude "*.py" \
            --exclude "compiled/*" \
            --delete
          echo "Documentação publicada em: https://${{ secrets.DOCS_BUCKET }}.s3.amazonaws.com/dbt-docs/index.html"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
