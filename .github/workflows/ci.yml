name: CloudMart DataOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 glue_jobs/ --max-line-length=120 --ignore=E501,W503,E302,E303

  cdk-synth:
    name: CDK Synth (validate IaC)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CDK CLI
        run: npm install -g aws-cdk
      - name: Install CDK Python deps
        working-directory: infrastructure/cdk
        run: pip install -r requirements.txt
      - name: CDK Synth
        working-directory: infrastructure/cdk
        run: cdk synth --no-staging
        env:
          AWS_DEFAULT_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
