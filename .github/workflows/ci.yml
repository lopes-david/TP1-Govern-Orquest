name: CloudMart DataOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 pytest pytest-cov pyspark==3.4.0 boto3 moto

      - name: Lint (flake8)
        run: flake8 glue_jobs/ --max-line-length=120 --ignore=E501,W503

      - name: Unit tests
        run: pytest tests/unit/ -v --cov=glue_jobs --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  dbt-validation:
    name: dbt Compile & Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-athena
        run: pip install dbt-athena-community

      - name: dbt compile (dry-run)
        working-directory: dbt
        run: dbt compile --profiles-dir . --target dev
        env:
          DBT_AWS_REGION: us-east-1

  cdk-synth:
    name: CDK Synth (validate IaC)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK Python deps
        working-directory: infrastructure/cdk
        run: pip install -r requirements.txt

      - name: CDK Synth
        working-directory: infrastructure/cdk
        run: cdk synth --no-staging
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy:
    name: Deploy para AWS (main only)
    runs-on: ubuntu-latest
    needs: [dbt-validation, cdk-synth]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync scripts Glue para S3
        run: |
          aws s3 sync glue_jobs/ s3://${{ secrets.GLUE_SCRIPTS_BUCKET }}/scripts/ \
            --exclude "*.pyc" --exclude "__pycache__/*"

      - name: CDK Deploy
        working-directory: infrastructure/cdk
        run: |
          pip install -r requirements.txt
          cdk deploy --all --require-approval never
