name: CloudMart DataOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Lint Python (Glue Jobs)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 glue_jobs/ --max-line-length=120 --ignore=E501,W503,W504,E302,E303,E221,E241,F401,F403

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Valida IaC (CDK Synth)
  # ──────────────────────────────────────────────────────────────────────────
  cdk-synth:
    name: CDK Synth (validate IaC)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CDK CLI
        run: npm install -g aws-cdk
      - name: Install CDK Python deps
        working-directory: infrastructure/cdk
        run: pip install -r requirements.txt
      - name: CDK Synth
        working-directory: infrastructure/cdk
        run: cdk synth --no-staging
        env:
          AWS_DEFAULT_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'AKIAIOSFODNN7EXAMPLE' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY' }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '000000000000' }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Valida modelos dbt (compilação sem conexão)
  # ──────────────────────────────────────────────────────────────────────────
  dbt-compile:
    name: dbt Compile (validate models)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt + Athena adapter
        run: pip install "dbt-athena-community>=1.8,<2.0"

      - name: dbt debug
        working-directory: dbt
        run: dbt debug --profiles-dir . --no-version-check || true
        env:
          DBT_S3_STAGING_DIR: "s3://placeholder/"
          AWS_DEFAULT_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      - name: dbt parse (validate SQL syntax)
        working-directory: dbt
        run: dbt parse --profiles-dir .
        env:
          DBT_S3_STAGING_DIR: "s3://placeholder/"
          AWS_DEFAULT_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
